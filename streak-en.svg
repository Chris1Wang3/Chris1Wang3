<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution streak</title>
  <desc id="desc">GitHub contribution and streak data for Chris1Wang3 over the past year.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2d"/>
    </linearGradient>
    <style>
      .title { font: 600 16px "Segoe UI", "Microsoft YaHei", sans-serif; }
      .label { font: 500 12px "Segoe UI", "Microsoft YaHei", sans-serif; }
      .value { font: 700 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="1" y="1" width="493" height="193" rx="12" fill="url(#bg)" stroke="#253249"/>
  <rect x="18" y="20" width="3" height="18" rx="1.5" fill="#8dd3a8"/>
  <text x="31" y="35" class="title" fill="#f3f7f5">GitHub contribution streak</text>
  <g>
    <text x="31" y="77" class="label" fill="#8b9bae">Current streak</text>
    <text x="31" y="113" class="value" fill="#8dd3a8">0 days</text>
  </g>
  <g>
    <text x="186" y="77" class="label" fill="#8b9bae">Longest streak</text>
    <text x="186" y="113" class="value" fill="#8dd3a8">4 days</text>
  </g>
  <g>
    <text x="341" y="77" class="label" fill="#8b9bae">Yearly contributions</text>
    <text x="341" y="113" class="value" fill="#8dd3a8">172</text>
  </g>
</svg>